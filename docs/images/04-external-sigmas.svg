<text x="40" y="306" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">transition_step 变为外部表中的切割索引：低分辨率阶段用表前 transition_step+1 个点。</text>
