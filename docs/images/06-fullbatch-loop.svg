<text x="40" y="430" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">连跑不会自动勾「已校验」——与手工流程一致，不会替你接受未审片的片段。</text>
<text x="40" y="448" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">「停在当前段」= 当前段跑完、检查点落盘后停下，下次 Queue 从断点续跑；ComfyUI 硬 Interrupt 则是立即中断、当前段作废。</text>
