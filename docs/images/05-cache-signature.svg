<text x="626" y="26" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#61617a">需要重渲</text>
<rect x="492" y="16" width="12" height="12" rx="3" fill="#f3eefc" stroke="#b8a1e8"/>
<text x="508" y="26" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#61617a">判定</text>
<rect x="40" y="66" width="200" height="54" rx="9" ry="9" fill="#ececed" stroke="#9a9aa8" stroke-width="1.4"/>
<text x="140.0" y="93.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38" font-weight="600">Queue 触发本节点</text>
<rect x="280" y="60" width="220" height="66" rx="9" ry="9" fill="#f3eefc" stroke="#b8a1e8" stroke-width="1.4"/>
<text x="390.0" y="85.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38">计算当前 SelfLift 参数签名</text>
<text x="390.0" y="103.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">含外接表的内容指纹</text>
<rect x="540" y="56" width="220" height="74" rx="9" ry="9" fill="#f3eefc" stroke="#b8a1e8" stroke-width="1.4"/>
<text x="650.0" y="85.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38" font-weight="600">比对 manifest 里的</text>
<text x="650.0" y="103.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">selflift_plan_signature</text>
<rect x="600" y="180" width="220" height="62" rx="9" ry="9" fill="#e8f5ec" stroke="#79b58c" stroke-width="1.4"/>
<text x="710.0" y="203.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38" font-weight="600">一致 → 百分百复用</text>
<text x="710.0" y="221.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">正常续跑，不重渲</text>
<rect x="280" y="300" width="220" height="76" rx="9" ry="9" fill="#fff2e2" stroke="#e0a860" stroke-width="1.4"/>
<text x="390.0" y="330.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38" font-weight="600">不一致 → 清空因果链</text>
<text x="390.0" y="348.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">_truncate_chain(..., 0)</text>
<rect x="40" y="300" width="200" height="76" rx="9" ry="9" fill="#fff2e2" stroke="#e0a860" stroke-width="1.4"/>
<text x="140.0" y="322.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38">整链重新 Render</text>
<text x="140.0" y="340.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">日志 SelfLift plan changed</text>
<text x="140.0" y="358.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">resetting N cached clip(s)</text>
<rect x="40" y="130" width="200" height="62" rx="9" ry="9" fill="#f3eefc" stroke="#b8a1e8" stroke-width="1.4"/>
<text x="140.0" y="161.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#2b2b38">继续采样当前链路</text>
<path d="M 240.0 93.0 L 280.0 93.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 500.0 93.0 L 540.0 93.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 650.0 130.0 L 710.0 180.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="711.2" y="144.0" width="13.6" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="718.0" y="156.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#61617a">一致</text>
<path d="M 650.0 130.0 L 390.0 300.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="647.8" y="204.0" width="20.4" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="658.0" y="216.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#61617a">不一致</text>
<path d="M 280.0 338.0 L 240.0 338.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 710.0 180.0 L 140.0 192.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 140.0 300.0 L 140.0 192.0" fill="none" stroke="#6b6b80" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">参数、语义桥、外接表链任一变化都会进签名；关闭语义桥时签名与开启前完全一致，不会白白重渲一次。</text>
<text x="40" y="418" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#61617a">三条链路（Ref2VA 运动链 / Ref2VA 独立瑞 / FL2VA）都接了；某条路径解析失败只打 WARNING，不中断生成。</text>
</svg>
