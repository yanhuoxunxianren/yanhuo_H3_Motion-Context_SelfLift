<rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
<text x="24" y="30" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2b2b38">⑤ 缓存一致性：什么时候会重渲</text>
<line x1="24" y1="40" x2="836" y2="40" stroke="#b8a1e8" stroke-width="1"/>
<rect x="728" y="16" width="12" height="12" rx="3" fill="#e8f5ec" stroke="#79b58c"/>
<text x="744" y="26" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#61617a">复用</text>
